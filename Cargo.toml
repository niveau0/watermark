[package]
name = "watermark"
version = "0.1.0"
edition = "2024"
description = "Robust, non-blind image watermarking that survives re-photographing"

[dependencies]
anyhow = "1"
blake3 = "1.8"
clap = { version = "4.6", features = ["derive", "env"] }
image = "0.25"
imageproc = { version = "0.27", default-features = false }
nalgebra = "0.35"
rayon = "1.10"

[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1
